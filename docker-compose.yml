# One-command self-hosting: PostgreSQL + xEdit.
#
#   cp .env.example .env      # set at least AUTH_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# The app container runs prisma migrate deploy on startup to create/migrate tables.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xedit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xedit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xedit -d xedit"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined at build time, so they must be passed here; changing them at runtime has no effect
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://xedit:${POSTGRES_PASSWORD}@db:5432/xedit
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (generate one with openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-}
      COVER_GENERATE_TIMEOUT_SEC: ${COVER_GENERATE_TIMEOUT_SEC:-}
      COVER_GENERATE_DAILY_LIMIT: ${COVER_GENERATE_DAILY_LIMIT:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEFAULT_STORAGE_QUOTA_MB: ${DEFAULT_STORAGE_QUOTA_MB:-}

volumes:
  pgdata:
