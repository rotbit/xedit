<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fafafa;
    color: #191919;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute; top: -260px; left: 50%; transform: translateX(-50%);
    width: 1100px; height: 620px; border-radius: 999px;
    background: radial-gradient(closest-side, rgba(37,38,45,0.06), transparent);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .brand .logo { width: auto; height: 40px; }
  .brand .sep { width: 1px; height: 22px; background: #d4d4d4; }
  .brand .tag { font-size: 18px; color: #8c8c8c; }

  h1 { font-size: 66px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em; }
  h1 .dim { color: #565656; }
  p.lead { margin-top: 26px; font-size: 22px; line-height: 1.7; color: #565656; max-width: 820px; }

  .chips { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid #e8e8e8; background: #fff; border-radius: 999px;
    padding: 10px 18px; font-size: 18px; color: #191919;
  }
  .chip i { width: 8px; height: 8px; border-radius: 999px; display: block; }

  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 44px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 18px; color: #8c8c8c;
  }
  .foot .url { color: #191919; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="brand">
    <img class="logo" src="../public/logo.svg" alt="xEdit" />
    <span class="sep"></span>
    <span class="tag">Markdown 公众号排版工具</span>
  </div>

  <h1>写 Markdown，<br />一键排版微信公众号</h1>
  <p class="lead">左边写 Markdown，右边就是公众号里的成稿。复制过去，样式一个不丢。</p>

  <div class="chips">
    <span class="chip"><i style="background:#c0392b"></i>13 套排版主题</span>
    <span class="chip"><i style="background:#0e9285"></i>公式 · 图床 · 长图</span>
    <span class="chip"><i style="background:#1e6bb8"></i>版本回滚 · 云端同步</span>
    <span class="chip"><i style="background:#8e44ad"></i>MCP 接入 AI</span>
  </div>

  <div class="foot">
    <span>免费 · 打开即写 · 无需注册</span>
    <span class="url">xedit.me　·　网页版 & Mac 客户端</span>
  </div>
</body>
</html>
